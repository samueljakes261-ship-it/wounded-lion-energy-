[pytest]
# IMPORTANT: keep this scoped to tests/.
#
# Several files elsewhere in the repo (e.g. parsers/betkanyon/test_feed.py)
# are standalone reconnaissance/demo scripts with real module-level side
# effects (live browser sessions, infinite polling loops) that are NOT
# guarded by `if __name__ == "__main__":`. Bare `pytest` with no testpaths
# will try to *import* those files during collection, which actually starts
# a live scan. Restricting collection to tests/ avoids that entirely.
testpaths = tests
